<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CHAKRA - Worker route</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#252B31}a:hover{color:#000000}
/* Leaf icon: Lucide (ISC License, (c) Lucide Icons and Contributors) via AnimateIcons (MIT License, (c) 2025 Avijit Dey) */
.chakra-leaf{transform-box:view-box;transform-origin:13px 12px}
.chakra-logo:hover .chakra-leaf{animation:chakraLeafSway .8s ease-in-out}
@keyframes chakraLeafSway{0%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; color: #252B31; font-family: Inter, sans-serif; background: #F3F6F4; overflow: hidden">
  <video src="/_blob/b53c54ab493d3988caccfdb23a9dd2c6" autoplay="" muted="" loop="" playsinline="" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0"></video>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(255,255,255,0.30); z-index: 0"></div>

  <div style="position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column">
    <header style="padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <a href="Home.dc.html" class="chakra-logo" style="display: inline-flex; align-items: center; gap: 7px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; color: #252B31; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path class="chakra-leaf" d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>CHAKRA</a>
        <span style="display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; background: rgba(255,255,255,0.9); border: 1px solid #E5E5E5; padding: 4px 10px; font-size: 11px; font-weight: 600; color: #1E6B47"><span style="width: 6px; height: 6px; border-radius: 50%; background: #1E6B47"></span>IMPLEMENTED</span>
      </div>
      <div>
        <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 40px; line-height: 1; letter-spacing: -0.02em">Today's <em style="color: {{accent}}">route</em></h1>
        <div style="margin-top: 4px; font-size: 13px; color: #3F4A4B">Plan for 25 Oct · {{ doneText }}</div>
      </div>
      <div role="tablist" aria-label="Vehicle" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; background: rgba(255,255,255,0.6); padding: 4px; border-radius: 999px">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
          <button type="button" role="tab" aria-selected="{{ t.selected }}" onClick="{{ t.pick }}" style="min-height: 48px; border-radius: 999px; border: none; background: {{ t.bg }}; color: {{ t.fg }}; font: 600 14px Inter, sans-serif; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: {{ t.shadow }}">{{ t.label }}<span style="font-size: 11px; font-weight: 400">{{ t.sub }}</span></button>
        </sc-for>
      </div>
    </header>

    <div style="flex: 1 1 auto; overflow-y: auto; padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{ stops }}" as="s" hint-placeholder-count="5">
        <div style="background: rgba(255,255,255,0.86); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 10px 30px -12px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.05); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; opacity: {{ s.opacity }}">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="flex: none; width: 32px; height: 32px; border-radius: 50%; background: {{ s.numBg }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">{{ s.mark }}</span>
            <div style="flex: 1 1 auto; min-width: 0">
              <div style="font-weight: 600; font-size: 15px">{{ s.name }}</div>
              <div style="font-size: 12px; color: #5E6A6B">{{ s.note }}</div>
            </div>
          </div>
          <sc-if value="{{ s.pending }}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 8px">
              <div role="group" aria-label="Level seen" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
                <sc-for list="{{ s.levels }}" as="l" hint-placeholder-count="3">
                  <button type="button" aria-pressed="{{ l.pressed }}" onClick="{{ l.pick }}" style="min-height: 44px; border-radius: 999px; border: 1px solid {{ l.border }}; background: {{ l.bg }}; color: {{ l.fg }}; font: 500 13px Inter, sans-serif; cursor: pointer">{{ l.label }}</button>
                </sc-for>
              </div>
              <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px">
                <button type="button" onClick="{{ s.done }}" style="min-height: 52px; border-radius: 999px; border: none; background: #252B31; color: #FFFFFF; font: 600 16px Inter, sans-serif; cursor: pointer">Done</button>
                <button type="button" style="min-height: 52px; border-radius: 999px; border: 1px solid #E5B8B8; background: #FFFFFF; color: #8C1D1D; font: 500 13px Inter, sans-serif; cursor: pointer">Report overflow</button>
              </div>
            </div>
          </sc-if>
        </div>
      </sc-for>

      <sc-if value="{{ showCompost }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ arrive }}" style="min-height: 56px; border-radius: 999px; border: none; background: #6B4A1E; color: #FFFFFF; font: 600 16px Inter, sans-serif; cursor: pointer">Arrived at compost stop</button>
      </sc-if>
      <sc-if value="{{ delivered }}" hint-placeholder-val="{{ false }}">
        <div role="status" style="background: rgba(243,237,228,0.95); color: #4A3314; border-radius: 16px; padding: 12px 14px; font-size: 14px">Delivered to compost stop. Delivery only, no compost output claimed.</div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E6B47","options":["#1E6B47","#4F46E5","#252B31"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { route: 'V1', done: {}, level: {}, delivered: false };

  renderVals() {
    const ROUTES = {
      V1: { label: 'V1 general', sub: 'back to depot', stops: [
        { id: 'HC-1', name: 'Hostel C bin 1', note: 'Overflowing now' },
        { id: 'HA-1', name: 'Hostel A bin 1', note: '74% chance of overflow' },
        { id: 'M1-G1', name: 'Mess 1 general bin 1', note: '82% chance of overflow' },
        { id: 'HF-5', name: 'Hostel F bin 5', note: '91% chance of overflow' },
        { id: 'HE-2', name: 'Hostel E bin 2', note: 'Reported by staff' },
        { id: 'HD-4', name: 'Hostel D bin 4', note: 'No fresh reading - tap a level' }
      ] },
      V2: { label: 'V2 food', sub: 'ends at compost stop', stops: [
        { id: 'M2-F2', name: 'Mess 2 food bin 2', note: '55% chance of overflow' },
        { id: 'M3-F1', name: 'Mess 3 food bin 1', note: '68% chance of overflow' }
      ] }
    };
    const accent = this.props.accent ?? '#1E6B47';
    const route = ROUTES[this.state.route];
    const tabs = Object.keys(ROUTES).map((key) => {
      const on = key === this.state.route;
      return {
        label: ROUTES[key].label, sub: ROUTES[key].sub,
        selected: on ? 'true' : 'false',
        bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#252B31' : '#3F4A4B',
        shadow: on ? '0 2px 12px rgba(0,0,0,0.10)' : 'none',
        pick: () => this.setState({ route: key })
      };
    });
    let doneCount = 0;
    const stops = route.stops.map((s, i) => {
      const doneAt = this.state.done[s.id];
      if (doneAt) doneCount += 1;
      const lv = this.state.level[s.id];
      const levels = [['low', 'Low'], ['medium', 'Medium'], ['full', 'Full']].map(([k, label]) => {
        const on = lv === k;
        return {
          label, pressed: on ? 'true' : 'false',
          bg: on ? '#252B31' : '#FFFFFF', fg: on ? '#FFFFFF' : '#252B31', border: on ? '#252B31' : 'rgba(37,43,49,0.15)',
          pick: () => this.setState({ level: { ...this.state.level, [s.id]: k } })
        };
      });
      return {
        name: s.name,
        note: doneAt ? 'Done at ' + doneAt + (lv ? ' · ' + lv : '') : s.note,
        pending: !doneAt,
        mark: doneAt ? '✓' : String(i + 1),
        numBg: doneAt ? accent : '#252B31',
        opacity: doneAt ? 0.85 : 1,
        levels,
        done: () => {
          const now = new Date();
          const t = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
          this.setState({ done: { ...this.state.done, [s.id]: t } });
        }
      };
    });
    const allDone = doneCount === route.stops.length;
    const isFood = this.state.route === 'V2';
    return {
      accent, tabs, stops,
      doneText: doneCount + ' of ' + route.stops.length + ' stops done',
      showCompost: isFood && allDone && !this.state.delivered,
      delivered: isFood && this.state.delivered,
      arrive: () => this.setState({ delivered: true })
    };
  }
}
</script>
</body>
</html>
