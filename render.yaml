services:
  - type: web
    name: chakra-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt -r requirements-ml.txt && bash scripts/fetch_model.sh
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MODEL_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CHAKRA_CORS_ORIGINS
        sync: false

  - type: web
    name: chakra-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
